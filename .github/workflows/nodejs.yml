{
  'name': 'Node.js CI',
  'on': ['push', 'pull_request'],
  'jobs':
    {
      'build':
        {
          'runs-on': 'ubuntu-latest',
          'strategy': { 'matrix': { 'node-version': ['22.x'] } },
          'steps':
            [
              { 'uses': 'actions/checkout@v6' },
              {
                'name': 'Use Node.js ${{ matrix.node-version }}',
                'uses': 'actions/setup-node@v6',
                'with': { 'node-version': '${{ matrix.node-version }}' },
              },
              { 'run': 'npm ci' },
              {
                'name': 'Generate OpenAPI Docs',
                'run': 'npm run build_openapi_schema',
              },
              {
                'name': 'Generate Code',
                'run': 'npm run generate_code --workspace=backend',
              },
              { 'run': 'npm run ts-check --workspace={frontend,backend}' },
              { 'run': 'npm run lint --workspace={frontend,backend}' },
              { 'run': 'npm run build --workspace=frontend' },
              { 'run': 'npm run build --workspace=backend' },
              { 'run': 'npm test --workspace=backend', 'env': { 'CI': true } },
              {
                'name': 'Upload validated X40 AArch64 candidate',
                'if': "github.ref == 'refs/heads/feature/x40-cleangenius-research' && github.event_name == 'push'",
                'uses': 'actions/upload-artifact@v7',
                'with': {
                  'name': 'x40-valetudo-aarch64-ci-candidate',
                  'path': './build/aarch64/valetudo',
                  'if-no-files-found': 'error',
                  'retention-days': 7
                }
              },
            ],
        },
    },
}
